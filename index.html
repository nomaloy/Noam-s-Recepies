["קוצצים את הנענע והפטרוזיליה. מערבבים בקערה את הבשר, הדריש, הביצה, הפטרוזיליה, חצי מהנענע ומעט מלח גס ולשים היטב.","Chop the mint and parsley. Mix the meat, bulgur, egg, parsley, half the mint and a little coarse salt, and knead well."],
["יוצרים קציצות עגולות ומהודקות. מחממים את השמן במחבת רחבה ועבה ומטגנים את הקציצות משני הצדדים עד שהן חומות בהירות. מעבירים לתבנית עם נייר סופג.","Shape firm round meatballs. Heat the oil in a wide heavy pan and brown the meatballs lightly on both sides. Drain on paper towels."],
["מעבירים את המחבת לאש נמוכה ומוסיפים את השום. מטגנים תוך ערבוב כ-3 דקות, מוסיפים פפריקה וצ'ילי, ואחרי דקה את העגבניות ומעט מלח גס. ממשיכים לבשל על אש נמוכה.","Turn the pan to low and add the garlic. Cook, stirring, about 3 minutes, add the paprika and chili, then after a minute the tomatoes and a little coarse salt. Keep cooking on low."],
["כשהעגבניות הפרישו נוזלים, מסדרים את הקציצות ברוטב, מכסים ומבשלים כשעה וחצי.","Once the tomatoes release their juices, nestle in the meatballs, cover and cook about 1½ hours."],
["חותכים את הפקוס לקוביות של 1*1 ס\"מ. כשהקציצות רכות מפזרים את הפקוס על התבשיל, ומעל את הנענע שנותרה, ומגישים.","Dice the fakkus into ⅜-inch (1 cm) cubes. When the meatballs are tender, scatter the fakkus and the remaining mint over the top and serve."]]},

{id:"asado",c:6,he:"אסאדו בתנור",en:"Oven Asado (Beef Short Ribs)",ing:[
"2.5|kg|אסאדו טרי עם עצמות|fresh bone-in beef short ribs (asado)",
"1|pc|צרור זעתר טרי|bunch fresh za'atar/bunches fresh za'atar",
"||מעט מלח גס|a little coarse salt"],st:[
["בסכין קטנה חורצים כ-10 חריצים קטנים (2 ס\"מ) בבשר, דוחפים לכל חריץ כמה עלי זעתר ומפזרים מעט מלח גס.","With a small knife cut about 10 small slits (¾ inch, 2 cm) into the meat, push a few za'atar leaves into each and sprinkle with a little coarse salt."],
["מניחים את גבעולי הזעתר ואת העלים הנותרים בתבנית אלומיניום ומניחים אותה בתחתית התנור.","Put the za'atar stems and remaining leaves in a foil pan on the floor of the oven."],
["מחממים את התנור למקסימום (270-300 מעלות) בתוכנית גריל עליון ותחתון.","Heat the oven to its maximum, 520–570°F (270–300°C), on top-and-bottom heat with the broiler."],
["מסדרים את הבשר על רשת כשהעצמות למטה ומכניסים למסילה האמצעית.","Set the meat on a rack, bones down, on the middle shelf."],
["המטבח יתמלא עשן. כשהנתח מזהיב היטב (כ-25 דק') מורידים את החום ל-140 מעלות וצולים עוד כ-4 שעות.","The kitchen will fill with smoke. Once well browned (about 25 minutes), lower the oven to 285°F (140°C) and roast about 4 more hours."]]},

{id:"hamin",c:6,he:"חמין פריקי וחומוס",en:"Freekeh and Chickpea Hamin",ing:[
"0.25|cup|שמן זית|olive oil",
"4|pc|בצלים גדולים פרוסים לרבעי טבעות דקות|large onion, thinly sliced into quarter-rings/large onions, thinly sliced into quarter-rings",
"0.5|cup|גרגרי חומוס|chickpeas",
"0.5|cup|מיץ ענבים (תירוש)|grape juice",
"2.5|cup|חיטה ירוקה (פריקי)|freekeh",
"1|kg|אונטריב|beef chuck rib (untrib)",
"8|pc|נקניקיות עגל חלב|veal sausage/veal sausages",
"3|pc|תפוחי אדמה גדולים חתוכים לרבעים|large potato, quartered/large potatoes, quartered",
"||מלח גס|coarse salt"],st:[
["מחממים את השמן על אש נמוכה בסיר בינוני שנכנס לתנור, מוסיפים את הבצל ומלח בנדיבות ומאדים עד שהבצל זהוב (כשעה). מערבבים הרבה כדי שלא יישרף.","Heat the oil over low heat in a medium ovenproof pot, add the onions and a generous amount of salt and cook until golden (about an hour), stirring often so they do not burn."],
["מוסיפים את החומוס, מערבבים ומגבירים את האש. אחרי כ-2 דקות מוסיפים את מיץ הענבים, מרתיחים, מוסיפים את הפריקי ומערבבים.","Add the chickpeas, stir and raise the heat. After about 2 minutes add the grape juice, bring to a boil, add the freekeh and stir."],
["אחרי עוד 2 דקות מוסיפים מים עד כ-5 ס\"מ מעל לכיסוי, מערבבים היטב, טועמים ומוסיפים מלח לפי הצורך.","After 2 more minutes add water to about 2 inches (5 cm) above, stir well, taste and add salt."],
["כשרותח מוסיפים את הבשר ו\"דוחפים\" אותו לתחתית הסיר, ומעליו מסדרים את תפוחי האדמה והנקניקיות.","When it boils, push the beef down to the bottom of the pot and arrange the potatoes and sausages on top."],
["מכסים בנייר אפייה ומעליו המכסה, ומעבירים לתנור בחום 100 מעלות ל-12-24 שעות.","Cover with parchment and then the lid, and bake at 210°F (100°C) for 12–24 hours."]]},

"450|g|גריסי פנינה|pearl barley",

"3|pc|תפוחי אדמה גדולים חתוכים לרבעים|large potato, quartered/large potatoes, quartered",
"||מלח גס|coarse salt"],st:[
["בסיר כבד בגודל בינוני מאדים את הבצל בשמן עם מעט מלח גס על אש נמוכה, תוך ערבוב, עד לקרמול – שעה עד שעה וחצי.","In a medium heavy pot, cook the onions in the oil with a little coarse salt over low heat, stirring, until caramelized, 1 to 1½ hours."],
["כשהבצל מקבל צבע חום עמוק מוסיפים את השעועית ומערבבים כדקה. מוסיפים את מיץ הענבים, מגבירים את האש ומביאים לרתיחה.","When the onions are deep brown, add the beans and stir for about a minute. Add the grape juice, raise the heat and bring to a boil."],
["מוסיפים את הגריסים, מנמיכים את האש ומערבבים היטב. מוסיפים מים עד 3 ס\"מ מעל לכיסוי.","Add the barley, lower the heat and stir well. Add water to 1¼ inches (3 cm) above everything."],
["מניחים את נתח הבשר במרכז הסיר, משקיעים אותו עד לתחתית ומסדרים מעליו את תפוחי האדמה.","Set the meat in the center of the pot, push it down to the bottom and arrange the potatoes on top."],
["מביאים לרתיחה, מכסים בנייר אפייה ומעליו מכסה הסיר, ומכניסים לתנור בחום 100 מעלות ל-12-18 שעות.","Bring to a boil, cover with parchment and then the lid, and bake at 210°F (100°C) for 12–18 hours."]]},

{id:"peanutchicken",c:7,he:"עוף בחמאת בוטנים",en:"Peanut Butter Chicken",y:[4,"מנות","servings"],ing:[

"||כמה טיפות חומץ בלסמי|a few drops balsamic vinegar",
"3|tbsp|רוטב סויה|soy sauce",
"||מעט מים|a little water",
"0.5|pc|צרור כוסברה טריה קצוצה|bunch fresh cilantro, chopped/bunches fresh cilantro, chopped"],st:[
["מנקים היטב את הכרעיים משאריות שומן ונוצות. מערבבים בקערה גדולה את שאר החומרים מלבד המים, מעסים את הכרעיים בתערובת ומדללים במים לפי הצורך. מכסים ומשאירים לילה במקרר.","Clean the legs of excess fat and any feathers. In a large bowl mix everything else except the water, rub it into the chicken and thin with water as needed. Cover and refrigerate overnight."],
["מחממים תנור ל-250 מעלות. שופכים את התערובת לתבנית עם דפנות גבוהות, מסדרים את הכרעיים כשהעור למעלה ומוסיפים מים עד חצי מגובה הכרעיים.","Heat the oven to 480°F (250°C). Pour the marinade into a high-sided pan, set the legs on it skin side up and add water halfway up the legs."],
["אופים כ-20 דקות ומורידים ל-170 מעלות ל-30 דקות נוספות. בזמן האפייה יוצקים מהנוזל על הכרעיים כל כמה דקות. בודקים בסכין שהעוף עשוי ומוציאים.","Roast about 20 minutes, then lower to 340°F (170°C) for 30 minutes more, basting with the pan liquid every few minutes. Check with a knife that it is cooked through."],
["מגישים כרע בכל צלחת, יוצקים מהנוזל ומפזרים מעט כוסברה.","Serve one leg per plate with some of the liquid and a little cilantro."]]},

{id:"lemonchicken",c:7,he:"קציצות עוף בלימון",en:"Lemon Chicken Patties",ing:[

"## רוטב|Sauce",

"4|pc|גבעולי סלרי ירוק קצוצים דק|celery stalk, finely chopped/celery stalks, finely chopped",
"2|tbsp|כורכום|turmeric",

"||מלח גס|coarse salt",
"1|pc|לימון, סחוט|lemon, juiced/lemons, juiced",
"3|pc|תפוחי אדמה בינוניים, קלופים וחתוכים לקוביות גדולות|medium potato, peeled and cut into large chunks/medium potatoes, peeled and cut into large chunks"],st:[
["סוחטים היטב את תפוח האדמה המגורר. בקערה מערבבים את הפרגיות, תפוח האדמה, הבצל הקצוץ דק, פירורי הלחם, הביצה, {1.5:tsp} כורכום, הכוסברה ומעט מאוד מלח. לשים היטב, מכסים ומקררים חצי שעה.","Squeeze the grated potato dry. Mix the chicken, potato, finely chopped onion, breadcrumbs, egg, {1.5:tsp} turmeric, coriander and a very little salt. Knead well, cover and refrigerate 30 minutes."],
["מכינים שלוש קערות: קמח, ביצים טרופות וסולת. בידיים רטובות יוצרים קציצות שטוחות מעט של כ-{40:g} ומעבירים כל אחת בקמח, בביצה ולבסוף בסולת.","Set out three bowls: flour, beaten egg and semolina. With wet hands shape slightly flat patties of about {40:g} and coat each in flour, then egg, then semolina."],
["מחממים את השמן לחום בינוני-גבוה ומטגנים כ-2 דקות מכל צד עד שהקציצות מזהיבות. מעבירים לנייר סופג. הן לא צריכות להיות עשויות עד הסוף; הן ימשיכו להתבשל ברוטב.","Heat the oil over medium-high heat and fry about 2 minutes per side until golden. Drain on paper towels. They do not need to be cooked through; they finish in the sauce."],
["בסיר רחב מחממים את שמן הזית על אש בינונית, מוסיפים את זרעי הכמון ומטגנים כחצי דקה עד שמריחים. מוסיפים את הבצל, הסלרי ומעט מלח גס ומאדים כ-10 דקות.","Heat the olive oil in a wide pot over medium heat, add the cumin seeds and fry about 30 seconds until fragrant. Add the onion, celery and a little coarse salt and cook about 10 minutes."],
["מוסיפים {2:tbsp} כורכום ומערבבים דקה, מוסיפים את תפוחי האדמה ומים עד כיסוי. מביאים לרתיחה, טועמים ומוסיפים מלח.","Add {2:tbsp} turmeric and stir for a minute, add the potatoes and water to cover. Bring to a boil, taste and add salt."],
["מסדרים את הקציצות מעל תפוחי האדמה ויוצקים את מיץ הלימון. מכסים, מנמיכים את האש ומבשלים כ-30 דקות, עד שתפוחי האדמה רכים והרוטב מסמיך מעט.","Lay the patties over the potatoes and pour in the lemon juice. Cover, lower the heat and cook about 30 minutes, until the potatoes are tender and the sauce thickens slightly."]]}

  ing:n=>n+" ingredients",steps:n=>n+" steps",check:"to check",calc:"Quantity calculator",calcSub:"loaves, rolls, vegan or dairy",
  back:"← All recipes",fav:"☆ Favorite",faved:"★ Favorite",wake:"☀ Keep screen on",noWake:"Not supported here",reset:"Clear checks",
  ingHead:"Ingredients",hint:"tap any number to change it",method:"Method",times:"×",timesLbl:"Batch size",reset1:"Back to original amounts",
  foot:"Tap a step to mark it done. Changing any amount rescales every ingredient and the amounts in the steps. US measures are rounded; weigh when you can.",
  noFav:"No favorites yet. Open a recipe and tap ☆ to add one.",none:"No recipe matches your search.",flag:"To check:",calcEyebrow:"Calculator"}};
const t=()=>UI[lang];

/* ---------- parsing ---------- */
function parseIng(arr){const groups=[];let g={h:null,items:[]};groups.push(g);
  arr.forEach(l=>{if(l.startsWith("## ")){const [h,e]=l.slice(3).split("|");g={h:[h,e],items:[]};groups.push(g);return}
    const [q,u,he,en]=l.split("|");let lo=null,hi=null;
    if(q.trim()){const p=q.split("-");lo=+p[0];hi=p[1]?+p[1]:null}
    g.items.push({lo,hi,u:u.trim(),he,en})});
  return groups.filter(x=>x.items.length)}
function parseSt(arr){const groups=[];let g={h:null,items:[]};groups.push(g);
  arr.forEach(s=>{if(typeof s==="string"){const [h,e]=s.slice(3).split("|");g={h:[h,e],items:[]};groups.push(g)}else g.items.push(s)});
  return groups.filter(x=>x.items.length)}
const SERV={sashimi:4,ceviche:4,carpaccio:4,sardines:4,palamida:4,fattoush:4,eggplant:2,falafel:6,hummus:6,krupnik:6,kneidlach:6,ramen:5,
  ptitim:6,freekeh:6,cannelloni:4,rigatoni:4,gnocchi:6,springpasta:4,risotto:8,bechamel:4,bolognese:4,shpondra:4,leekpatties:4,tataki:4,
  lambballs:4,asado:6,hamin:8,cholent:8,peanutchicken:4,lemonchicken:4};
R.forEach(r=>{if(!r.calc)r.y=[SERV[r.id]||4,"סועדים","servings"]});
R.forEach(r=>{r.I=parseIng(r.ing);r.S=parseSt(r.st);
  r.nI=r.I.reduce((a,g)=>a+g.items.length,0);r.nS=r.S.reduce((a,g)=>a+g.items.length,0);
  r.flags=r.S.reduce((a,g)=>a+g.items.filter(s=>s[2]).length,0);
  r.hay=(r.he+" "+r.en+" "+r.ing.join(" ")).toLowerCase()});

/* ---------- number formatting ---------- */
const FR=[[0,""],[.125,"⅛"],[.25,"¼"],[.333,"⅓"],[.5,"½"],[.667,"⅔"],[.75,"¾"],[.875,"⅞"],[1,""]];
function frac(x){let w=Math.floor(x),rem=x-w,b=FR[0];FR.forEach(f=>{if(Math.abs(f[0]-rem)<Math.abs(b[0]-rem))b=f});
  if(b[0]===1){w+=1;b=FR[0]}if(w===0&&!b[1])return x>0?"⅛":"0";return (w>0?w:"")+b[1]}
function roundG(x){return x<25?Math.round(x*2)/2:x<200?Math.round(x):Math.round(x/5)*5}
function dec(x,d){return String(Math.round(x*Math.pow(10,d))/Math.pow(10,d))}
const HEU={g:["גר'","גר'"],kg:['ק"ג','ק"ג'],ml:['מ"ל','מ"ל'],l:["ליטר","ליטר"],cup:["כוס","כוסות"],tbsp:["כף","כפות"],tsp:["כפית","כפיות"],pc:["",""]};
const OZ=28.3495;
/* returns {n: display number string, u: unit label, f: base units per displayed unit, sub: secondary text} */
function disp(x,u){
  if(!EN()){
    const pl=x>1.01?1:0, lab=HEU[u]?HEU[u][pl]:"";
    if(u==="g"||u==="ml")return{n:String(roundG(x)),u:lab,f:1};
    if(u==="kg")return{n:dec(x,2),u:lab,f:1};
    if(u==="l")return{n:dec(x,x<10?2:1),u:lab,f:1};
    return{n:frac(x),u:lab,f:1};
  }
  if(u==="g"){const oz=x/OZ;if(oz>=16)return{n:dec(oz/16,oz>=48?1:2),u:"lb",f:453.6,sub:roundG(x)+" g"};
    return{n:oz>=3?String(Math.round(oz*4)/4):oz>=.5?dec(oz,1):dec(oz,2),u:"oz",f:OZ,sub:roundG(x)+" g"}}
  if(u==="kg"){const lb=x*2.20462;return{n:dec(lb,lb<10?2:1),u:"lb",f:1/2.20462,sub:dec(x,2)+" kg"}}
  if(u==="ml"){if(x<=45){const tb=x/14.787;return tb>=1?{n:frac(tb),u:"Tbsp",f:14.787,sub:roundG(x)+" ml"}:{n:frac(tb*3),u:"tsp",f:4.929,sub:roundG(x)+" ml"}}
    const c=x/236.6;return{n:frac(c),u:c>1.01?"cups":"cup",f:236.6,sub:roundG(x)+" ml"}}
  if(u==="l"){const c=x*1000/236.6;if(c>=8)return{n:frac(x*1.05669),u:"qt",f:1/1.05669,sub:dec(x,2)+" l"};
    return{n:frac(c),u:c>1.01?"cups":"cup",f:0.2366,sub:dec(x,2)+" l"}}
  if(u==="cup")return{n:frac(x),u:x>1.01?"cups":"cup",f:1};
  if(u==="tbsp")return{n:frac(x),u:"Tbsp",f:1};
  if(u==="tsp")return{n:frac(x),u:"tsp",f:1};
  return{n:frac(x),u:"",f:1};
}
function amountHtml(lo,hi,u,s){const a=disp(lo*s,u);let n=a.n;if(hi!=null)n+="–"+disp(hi*s,u).n;
  return '<span class="num" dir="ltr">'+esc(n)+'</span>'+(a.u?" "+esc(a.u):"")}
function parseNum(str){str=String(str).trim().replace(",",".");const map={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125,"⅞":.875};
  let v=0,m;
  for(const k in map)if(str.includes(k)){v+=map[k];str=str.replace(k,"")}
  str=str.trim();
  if((m=str.match(/^(\d+)\s+(\d+)\/(\d+)$/)))return v+ +m[1]+m[2]/m[3];
  if((m=str.match(/^(\d+)\/(\d+)$/)))return v+m[1]/m[2];
  if(str==="")return v||NaN;
  const n=parseFloat(str);return isFinite(n)?v+n:NaN}
function ingName(it,x){if(!EN())return it.he;const p=it.en.split("/");return (x>1.01&&p[1])?p[1]:p[0]}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function stepHtml(txt,s){return esc(txt).replace(/\{([\d.]+)(?:-([\d.]+))?:(\w+)\}/g,(m,a,b,u)=>"<b>"+amountHtml(+a,b!=null?+b:null,u,s)+"</b>")}

/* ---------- shell ---------- */
const main=document.getElementById("main"),q=document.getElementById("q");
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=EN()?"ltr":"rtl";
  document.title=t().title;document.getElementById("brand").textContent=t().title;
  q.placeholder=t().search;q.setAttribute("aria-label",t().search);
  wireLang();
}
function wireLang(){document.querySelectorAll(".langseg button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.v===lang);b.onclick=()=>{if(b.dataset.v===lang)return;lang=b.dataset.v;store.set("lang",lang);
  try{localStorage.setItem("challah_lang",lang)}catch(e){}applyLang();route(true)}})}
const LANGSEG='<div class="langseg" role="group" aria-label="Language"><button data-v="he">עברית</button><button data-v="en">English</button></div>';

function chips(){const el=document.getElementById("chips");
  const opts=[[-1,t().all,R.length],[-2,t().favs,favs.size],...CATS.map((n,i)=>[i,n[EN()?1:0],R.filter(r=>r.c===i).length])];
  el.innerHTML=opts.map(([i,n,c])=>`<button class="chip" data-c="${i}" aria-pressed="${cat===i}">${esc(n)}<span class="n">${c}</span></button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=+b.dataset.c;store.set("cat",cat);chips();list()})}
const nm=r=>EN()?r.en:r.he;
function card(r){const meta=r.calc?`<span class="calcpill">${t().calc}</span><span>${t().calcSub}</span>`
  :`<span>${t().ing(r.nI)}</span><span>${t().steps(r.nS)}</span>${r.y?`<span>${r.y[0]} ${esc(r.y[EN()?2:1])}</span>`:""}${r.flags?`<span class="flagpill">${r.flags} ${t().check}</span>`:""}`;
  return `<button class="card" data-id="${r.id}"><span class="t">${favs.has(r.id)?'<span class="star">★ </span>':""}${esc(nm(r))}</span><span class="meta">${meta}</span></button>`}
function list(){
  document.getElementById("count").textContent=t().count(R.length);
  const term=q.value.trim().toLowerCase();
  const rs=R.filter(r=>(!term||r.hay.includes(term))&&(cat===-1||(cat===-2?favs.has(r.id):r.c===cat)));
  if(!rs.length){main.innerHTML=`<p class="empty">${cat===-2&&!term?t().noFav:t().none}</p>`;return}
  main.innerHTML=CATS.map((n,i)=>[n[EN()?1:0],rs.filter(r=>r.c===i)]).filter(g=>g[1].length)
    .map(([n,a])=>`<section class="group"><h2>${esc(n)}<small>${a.length}</small></h2><div class="grid">${a.map(card).join("")}</div></section>`).join("");
  main.querySelectorAll(".card").forEach(b=>b.onclick=()=>{location.hash=b.dataset.id})}

/* ---------- recipe view ---------- */
let wake=null, cur=null, scale=1, focusId=null;
const scales=store.get("scales",{});
async function toggleWake(btn){
  if(wake){try{await wake.release()}catch(e){}wake=null;btn.setAttribute("aria-pressed","false");return}
  try{wake=await navigator.wakeLock.request("screen");btn.setAttribute("aria-pressed","true");
    wake.addEventListener("release",()=>{wake=null;btn.setAttribute("aria-pressed","false")})}
  catch(e){btn.textContent=t().noWake;setTimeout(()=>btn.textContent=t().wake,2200)}}
function head(r,eyebrow){return `<button class="back" id="back">${t().back}</button>
  <div class="rhead"><div><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(nm(r))}</h2></div>
  <div class="tools">${LANGSEG}<button class="tbtn" id="fav" aria-pressed="${favs.has(r.id)}">${favs.has(r.id)?t().faved:t().fav}</button>
  ${r.calc?"":`<button class="tbtn" id="wake" aria-pressed="false">${t().wake}</button><button class="tbtn" id="reset">${t().reset}</button>`}</div></div>`}
function wireHead(r){
  wireLang();
  document.getElementById("back").onclick=()=>{location.hash=""};
  const fb=document.getElementById("fav");
  fb.onclick=()=>{favs.has(r.id)?favs.delete(r.id):favs.add(r.id);store.set("favs",[...favs]);
    fb.setAttribute("aria-pressed",favs.has(r.id));fb.textContent=favs.has(r.id)?t().faved:t().fav};
  const wb=document.getElementById("wake");
  if(wb){if(!("wakeLock" in navigator))wb.hidden=true;else wb.onclick=()=>toggleWake(wb)}
  const rs=document.getElementById("reset");
  if(rs)rs.onclick=()=>{main.querySelectorAll(".method li").forEach(l=>l.classList.remove("done"));main.querySelectorAll(".ing input[type=checkbox]").forEach(i=>i.checked=false)};
}
function showCalc(r){
  document.getElementById("top").hidden=true;
  main.innerHTML=head(r,CATS[r.c][EN()?1:0]+" · "+t().calcEyebrow)+`<iframe id="calc" class="calcframe" title="${esc(nm(r))}"></iframe>`;
  window.scrollTo(0,0);wireHead(r);
  try{localStorage.setItem("challah_lang",lang)}catch(e){}
  const fr=document.getElementById("calc");
  const fit=()=>{try{const d=fr.contentDocument;fr.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+"px"}catch(e){}};
  fr.addEventListener("load",()=>{try{const d=fr.contentDocument,th=document.documentElement.getAttribute("data-theme");
    if(th)d.documentElement.setAttribute("data-theme",th);
    fit();if(window.ResizeObserver)new ResizeObserver(fit).observe(d.body);
    d.addEventListener("click",()=>setTimeout(fit,0));d.addEventListener("input",fit)}catch(e){}});
  fr.srcdoc=document.getElementById("challahSrc").textContent.replace(/<\\\/script/g,"<"+"/script");
}
function show(r,keep){
  if(r.calc)return showCalc(r);
  document.getElementById("top").hidden=true;
  if(!keep){cur=r;scale=scales[r.id]||1}
  const ingHtml=r.I.map((g,gi)=>`${g.h?`<h4>${esc(g.h[EN()?1:0])}</h4>`:""}<ul>${g.items.map((it,ii)=>{
    const id=`i-${gi}-${ii}`;
    if(it.lo==null)return `<li><label class="irow"><input type="checkbox" id="c-${gi}-${ii}"><span class="iname">${esc(ingName(it,0))}</span></label></li>`;
    const x=it.lo*scale,d=disp(x,it.u),rng=it.hi!=null;
    const amt=rng?`<span class="amt">${amountHtml(it.lo,it.hi,it.u,scale)}</span>`
      :`<input class="qin" id="${id}" data-g="${gi}" data-i="${ii}" inputmode="decimal" value="${esc(d.n)}" aria-label="${esc(ingName(it,x))}"><span class="qu">${esc(d.u)}</span>`;
    return `<li><div class="irow"><input type="checkbox" id="c-${gi}-${ii}" aria-label="${esc(ingName(it,x))}"><label for="c-${gi}-${ii}" class="iname">${esc(ingName(it,x))}${d.sub?`<small>${esc(d.sub)}</small>`:""}</label><span class="qty">${amt}</span></div></li>`}).join("")}</ul>`).join("");
  const stHtml=r.S.map(g=>`${g.h?`<h4>${esc(g.h[EN()?1:0])}</h4>`:""}<ol>${g.items.map(s=>`<li><span>${stepHtml(s[EN()?1:0],scale)}${s[2]?`<span class="flag"><b>${t().flag}</b> ${esc(s[EN()?3:2])}</span>`:""}</span></li>`).join("")}</ol>`).join("");
  const y=r.y;
  const sv=y[0]*scale;
  const tiles=`<div class="tiles">
    <div class="tile"><div class="tl">${EN()?"Servings":"מספר סועדים"}</div>
      <div class="tedit"><button class="pm" id="minus" aria-label="${EN()?"Fewer servings":"פחות סועדים"}">−</button><input class="tin" id="yIn" inputmode="decimal" value="${esc(dec(sv,1))}" aria-label="${EN()?"Servings":"מספר סועדים"}"><button class="pm" id="plus" aria-label="${EN()?"More servings":"יותר סועדים"}">+</button></div>
      <div class="tl">${EN()?"Recipe written for "+y[0]:"המתכון המקורי ל־"+y[0]+" סועדים"}${Math.abs(scale-1)>1e-6?` · <button class="linkbtn" id="orig">${EN()?"reset":"חזרה למקור"}</button>`:""}</div></div>
  </div>`;
  const checked=keep?[...main.querySelectorAll(".ing input[type=checkbox]")].map(c=>c.checked):null;
  const done=keep?[...main.querySelectorAll(".method li")].map(l=>l.classList.contains("done")):null;
  main.innerHTML=head(r,CATS[r.c][EN()?1:0])+tiles+`
  <div class="layout"><aside class="ing"><div class="ihead"><h3>${t().ingHead}</h3><span class="hint">${t().hint}</span></div>${ingHtml}</aside>
  <section class="method"><h3>${t().method}</h3>${stHtml}<p class="foot">${t().foot}</p></section></div>`;
  if(checked)main.querySelectorAll(".ing input[type=checkbox]").forEach((c,i)=>c.checked=!!checked[i]);
  if(done)main.querySelectorAll(".method li").forEach((l,i)=>done[i]&&l.classList.add("done"));
  if(!keep)window.scrollTo(0,0);
  wireHead(r);
  main.querySelectorAll(".method li").forEach(li=>li.onclick=()=>li.classList.toggle("done"));
  bindIn("yIn",v=>v/y[0]);
  const step=d=>{const n=Math.max(1,Math.round(y[0]*scale)+d);setScale(n/y[0])};
  document.getElementById("minus").onclick=()=>step(-1);
  document.getElementById("plus").onclick=()=>step(1);
  const ob=document.getElementById("orig");if(ob)ob.onclick=()=>setScale(1);
  main.querySelectorAll(".qin").forEach(el=>{const it=r.I[+el.dataset.g].items[+el.dataset.i];
    bindIn(el.id,v=>v*disp(it.lo*scale,it.u).f/it.lo)});
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();const n=el.value.length;try{el.setSelectionRange(n,n)}catch(e){}}}
}
function setScale(s){if(!(s>0)||!isFinite(s))return;scale=Math.min(Math.max(s,0.05),50);scales[cur.id]=scale;store.set("scales",scales);focusId=null;show(cur,true)}
function bindIn(id,toScale){const el=document.getElementById(id);if(!el)return;
  el.addEventListener("focus",()=>{if(focusId!==id)el.select()});
  el.addEventListener("keydown",e=>{if(e.key==="Enter")el.blur()});
  el.addEventListener("change",()=>{const v=parseNum(el.value);focusId=null;if(v>0)setScale(toScale(v));else show(cur,true)});
}
function home(){document.getElementById("top").hidden=false;chips();list()}
function route(keep){const id=location.hash.slice(1);const r=R.find(x=>x.id===id);
  if(wake){try{wake.release()}catch(e){}wake=null}
  if(r){if(keep&&cur&&cur.id===r.id)show(r,true);else show(r)}else home()}
q.addEventListener("input",()=>{if(location.hash)location.hash="";list()});
window.addEventListener("hashchange",()=>route());
applyLang();route();

</script>
